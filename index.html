<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数据处理工作台</title>
<style>
:root{
  --bg:#0A0F1C; --bg2:#0E1526; --bg3:#111B2E; --bg4:#18233A;
  --line:#1F2B44; --line2:#2A3A5C;
  --tx:#DCE4F0; --tx2:#8B99B5; --tx3:#5A6880;
  --blue:#4D8DF6; --green:#34C98F; --red:#F0616D; --amber:#F5B548; --purple:#9B8CFF; --teal:#2CC7C7;
  --mono:"Cascadia Code",Consolas,monospace;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:13px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font:inherit;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#23304F;border-radius:5px}
::-webkit-scrollbar-track{background:transparent}

/* ============ 框架 ============ */
.app{display:grid;grid-template-rows:46px 1fr 48px;height:100vh}
.topbar{display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--bg2)}
.brand{display:flex;align-items:center;gap:8px;font-weight:500;font-size:14px;white-space:nowrap}
.logo{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--blue),var(--purple));display:grid;place-items:center;font-size:12px;color:#fff}
.topsearch{flex:1;max-width:420px;margin-left:8px;position:relative}
.topsearch input{width:100%;background:var(--bg3);border:1px solid var(--line);border-radius:var(--r);padding:5px 12px 5px 30px;font-size:12.5px;outline:none}
.topsearch input:focus{border-color:var(--blue)}
.topsearch .mag{position:absolute;left:9px;top:6px;color:var(--tx3)}
.topsearch .hint{position:absolute;right:10px;top:6px;font-size:11px;color:var(--tx3)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 10px;border-radius:20px;border:1px solid var(--line);white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--tx3)}
.pill.on .dot{background:var(--green);box-shadow:0 0 6px var(--green)}
.pill.on{border-color:rgba(52,201,143,.4);color:var(--tx)}
.pill.off .dot{background:var(--amber)}
.topbtns{display:flex;gap:6px;margin-left:auto}
.tbtn{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:var(--r);font-size:12.5px;border:1px solid transparent}
.tbtn:hover{background:var(--bg3)}
.tbtn.on{background:var(--bg4);border-color:var(--line2)}
.tbtn.prim{background:var(--blue);color:#fff}
.tbtn.prim:hover{filter:brightness(1.1)}
.tbtn svg{width:15px;height:15px}

.main{display:grid;grid-template-columns:264px 1fr 0px;min-height:0}
.main.showdetail{grid-template-columns:264px 1fr 316px}
.col{min-height:0;display:flex;flex-direction:column}
.side{border-right:1px solid var(--line);background:var(--bg2)}
.detail{border-left:1px solid var(--line);background:var(--bg2)}

/* ============ 左：资产树 ============ */
.sidehd{display:flex;align-items:center;gap:6px;padding:10px 12px 6px;font-size:12px;color:var(--tx2)}
.sidehd .grow{flex:1}
.iconbtn{display:grid;place-items:center;width:22px;height:22px;border-radius:6px;color:var(--tx2)}
.iconbtn:hover{background:var(--bg4);color:var(--tx)}
.iconbtn svg{width:14px;height:14px}
#assetTree{flex:1;overflow-y:auto;padding:2px 8px 10px}
.treegrp{font-size:11.5px;color:var(--tx3);padding:10px 6px 4px;display:flex;align-items:center;gap:5px}
.treegrp .cnt{color:var(--tx3)}
.aitem{padding:6px 8px;border-radius:8px;cursor:pointer;position:relative;border:1px solid transparent}
.aitem:hover{background:var(--bg3)}
.aitem.sel{background:var(--bg4);border-color:var(--line2)}
.aitem .row1{display:flex;align-items:center;gap:7px;min-width:0}
.aitem .nm{font-size:12.8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aitem .row2{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--tx2);margin-top:2px;padding-left:20px}
.ty{font-size:10px;padding:0 5px;border-radius:4px;flex:none;font-weight:500}
.ty.umi{background:rgba(52,201,143,.16);color:var(--green)}
.ty.ego{background:rgba(155,140,255,.16);color:var(--purple)}
.ty.sim{background:rgba(245,181,72,.16);color:var(--amber)}
.ty.teleop{background:rgba(77,141,246,.16);color:var(--blue)}
.ty.v21{background:rgba(44,199,199,.14);color:var(--teal)}
.ty.v30{background:rgba(77,141,246,.18);color:#7FB0FF}
.steps{display:inline-flex;gap:3px;margin-left:auto}
.steps i{width:5px;height:5px;border-radius:50%;background:var(--bg4);flex:none}
.steps i.on{background:var(--green)}
.flag{font-size:10px;padding:0 4px;border-radius:4px;flex:none}
.flag.bad{background:rgba(240,97,109,.18);color:var(--red)}
.flag.warn{background:rgba(245,181,72,.16);color:var(--amber)}
.treefoot{padding:8px;border-top:1px solid var(--line)}
.treefoot .scanline{display:flex;gap:6px;margin-top:6px}
.treefoot input{flex:1;background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:12px;outline:none;min-width:0}
.treefoot .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.treefoot .chip{font-size:11px;color:var(--tx2);border:1px solid var(--line);border-radius:12px;padding:1px 8px;display:inline-flex;gap:4px;align-items:center}
.treefoot .chip b{color:var(--tx)}
.treefoot .chip button{color:var(--tx3);font-size:12px;line-height:1}
.treefoot .chip button:hover{color:var(--red)}

/* ============ 中：对话/资料 ============ */
.center{background:var(--bg)}
.cview{flex:1;overflow-y:auto;padding:18px 24px;scroll-behavior:smooth}
#chatFlow{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:10px;max-width:100%}
.msg .who{flex:none;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:11px;margin-top:2px}
.msg.u .who{background:var(--blue);color:#fff}
.msg.a .who{background:linear-gradient(135deg,var(--purple),var(--blue));color:#fff;font-size:12px}
.msg.bubble{min-width:0;flex:1}
.msg .bd{background:var(--bg2);border:1px solid var(--line);border-radius:4px 12px 12px 12px;padding:10px 13px;white-space:pre-wrap;word-break:break-word}
.msg.a .bd{border-radius:12px 4px 12px 12px}
.msg.u .bd{background:var(--bg3)}
.msg .meta{font-size:11px;color:var(--tx3);margin-top:4px;padding-left:2px}
.actrow{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.act{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;border:1px solid var(--line2);border-radius:8px;padding:5px 12px;background:var(--bg3)}
.act:hover{border-color:var(--blue);color:var(--tx)}
.act.prim{background:var(--blue);border-color:var(--blue);color:#fff}
.act.prim:hover{filter:brightness(1.12)}
.act.danger:hover{border-color:var(--red);color:var(--red)}
.act:disabled{opacity:.5;cursor:not-allowed}
.act svg{width:13px;height:13px}
.logbox{margin-top:8px;background:#070B14;border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-family:var(--mono);font-size:11.5px;color:#9FB4D8;max-height:200px;overflow:auto;white-space:pre-wrap;line-height:1.55}
.quickwrap{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.qchip{font-size:12px;border:1px dashed var(--line2);color:var(--tx2);border-radius:16px;padding:4px 12px;cursor:pointer}
.qchip:hover{color:var(--blue);border-color:var(--blue)}
.hello{margin-bottom:6px}
.hello h1{font-size:19px;font-weight:500;margin-bottom:6px}
.hello p{color:var(--tx2)}
.statline{display:flex;gap:22px;margin:14px 0 4px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column}
.stat b{font-size:20px;font-weight:500}
.stat b.blue{color:var(--blue)} .stat b.green{color:var(--green)} .stat b.amber{color:var(--amber)}
.stat span{font-size:11.5px;color:var(--tx3)}

/* 资料视图（知识/论文/笔记） */
.dataview{display:none;height:100%;flex-direction:column;min-height:0}
.dataview.on{display:flex}
.dvbar{display:flex;align-items:center;gap:8px;padding:10px 22px;border-bottom:1px solid var(--line);background:var(--bg)}
.dvbar .dtabs{display:flex;gap:4px;background:var(--bg2);padding:3px;border-radius:10px}
.dvbar .dtab{padding:4px 14px;border-radius:7px;font-size:12.5px;color:var(--tx2)}
.dvbar .dtab.on{background:var(--bg4);color:var(--tx)}
.dvbody{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,44%) 1fr;gap:0;overflow:hidden}
.dvlist{overflow-y:auto;border-right:1px solid var(--line);padding:10px}
.dvdetail{overflow-y:auto;padding:16px 20px}
.kitem{padding:9px 11px;border-radius:9px;cursor:pointer;border:1px solid transparent}
.kitem:hover{background:var(--bg3)}
.kitem.sel{background:var(--bg4);border-color:var(--line2)}
.kitem .kt{font-weight:500;font-size:13px}
.kitem .ks{font-size:12px;color:var(--tx2);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kitem .ktags{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
.tag{font-size:10.5px;color:var(--tx2);border:1px solid var(--line);padding:0 6px;border-radius:4px}
.pitem{display:flex;gap:9px;padding:9px 10px;border-radius:9px;cursor:pointer;border:1px solid transparent}
.pitem:hover{background:var(--bg3)}
.pitem.sel{background:var(--bg4);border-color:var(--line2)}
.pitem .star{color:var(--amber)}
.pitem .pt{font-weight:500;font-size:12.8px;line-height:1.45}
.pitem .pm{font-size:11px;color:var(--tx3);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.pitem .ps{font-size:12px;color:var(--tx2);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.det h3{font-size:16px;font-weight:500;margin-bottom:6px;line-height:1.5}
.det .sub{color:var(--tx2);font-size:12.5px;margin-bottom:10px}
.det .tag{display:inline-block;margin:0 4px 4px 0}
.det .full{white-space:pre-wrap;font-size:13px;color:var(--tx);margin-top:8px;line-height:1.75}
.det .acts{margin-top:14px}
.linkbtn{color:var(--blue);text-decoration:none;font-size:12.5px}
.emptyline{color:var(--tx3);padding:26px 10px;text-align:center;font-size:12.5px}

/* ============ 右：详情 ============ */
.detpane{padding:14px;overflow-y:auto;flex:1}
.detpane h2{font-size:14.5px;font-weight:500;display:flex;align-items:center;gap:8px;word-break:break-all}
.detpane .kv{margin-top:12px;display:flex;flex-direction:column;gap:5px}
.detpane .kv .r{display:flex;font-size:12.3px;gap:8px}
.detpane .kv .k{color:var(--tx3);width:62px;flex:none}
.detpane .kv .v{color:var(--tx);word-break:break-all}
.pipebar{display:flex;gap:4px;margin:12px 0 6px}
.pipebar .seg{flex:1;height:5px;border-radius:3px;background:var(--bg4)}
.pipebar .seg.on{background:var(--green)}
.pipebar .seg.cur{background:var(--amber)}
.plab{display:flex;justify-content:space-between;font-size:11px;color:var(--tx3);margin-bottom:4px}
.qrow{display:flex;align-items:center;gap:8px;font-size:12.3px;padding:6px 9px;border-radius:8px;background:var(--bg3);margin-top:6px}
.qrow .v{font-weight:500}
.qrow.ok .v{color:var(--green)} .qrow.warn .v{color:var(--amber)} .qrow.bad .v{color:var(--red)}
.qchuman{margin-top:7px;background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:12px;color:var(--tx2)}
.qchuman .qc-ep{color:var(--tx);font-weight:500}
.qchuman .qc-r{color:var(--red)}
.qchuman .qc-a{color:var(--amber);display:block;margin:2px 0 6px}
.pacts{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.detempty{padding:20px 8px;color:var(--tx3);font-size:12.5px;line-height:1.8}
.detempty .qh{color:var(--tx2);font-weight:500;margin:12px 0 6px}
.detempty .qchip{margin:3px 4px 3px 0;display:inline-block}
.copyok{color:var(--green)!important}

/* ============ 底部命令 ============ */
.cmdbar{display:flex;align-items:center;gap:10px;padding:8px 16px;border-top:1px solid var(--line);background:var(--bg2)}
.cmdwrap{flex:1;display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--line);border-radius:12px;padding:6px 8px 6px 13px;max-width:880px;margin:0 auto}
.cmdwrap input{flex:1;background:none;border:none;outline:none;font-size:13px;color:var(--tx)}
.cmdwrap input::placeholder{color:var(--tx3)}
.cmdwrap .cmdhint{font-size:11px;color:var(--tx3);white-space:nowrap}
.sendbtn{width:30px;height:30px;border-radius:9px;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none}
.sendbtn:hover{filter:brightness(1.12)}
.aiind{width:auto;padding:0 4px;display:flex;align-items:center;gap:4px;font-size:11px;color:var(--tx3)}
.aiind b{font-weight:400}

/* ============ 浮层 ============ */
.overlay{position:fixed;inset:0;background:rgba(4,8,16,.6);display:none;place-items:center;z-index:50}
.overlay.on{display:grid}
.dialog{width:560px;max-width:92vw;max-height:86vh;overflow:auto;background:var(--bg2);border:1px solid var(--line2);border-radius:14px;padding:18px 20px}
.dialog h3{font-size:15px;font-weight:500;margin-bottom:4px}
.dialog .sub{color:var(--tx2);font-size:12px;margin-bottom:14px}
.frow{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.frow label{font-size:12px;color:var(--tx2)}
.frow input,.frow select{background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12.8px;outline:none}
.frow input:focus{border-color:var(--blue)}
.frow .hint{font-size:11px;color:var(--tx3)}
.dlgacts{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.dlgacts .act{padding:6px 16px}
.errbar{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);background:#3A1420;color:#F7B7BD;border:1px solid #6E2436;padding:6px 16px;border-radius:10px;font-size:12.5px;display:none;z-index:60;max-width:80vw}
@media(max-width:980px){.main{grid-template-columns:220px 1fr 0}.main.showdetail{grid-template-columns:220px 1fr 280px}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand"><span class="logo">D</span>数据工作台</div>
    <div class="topsearch">
      <span class="mag"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></span>
      <input id="searchInp" placeholder="搜索数据、论文、知识…（Ctrl+K）" autocomplete="off">
      <span class="hint">⌘K</span>
    </div>
    <span class="pill off" id="enginePill"><span class="dot"></span><span id="engineTxt">引擎离线</span></span>
    <div class="topbtns">
      <button class="tbtn" id="btnData" title="资料：知识库 / 论文流 / 我的积累"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v14H4z"/><path d="M4 9h16M9 5v14"/></svg>资料</button>
      <button class="tbtn on" id="btnChat" title="回到对话"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a8 8 0 01-8 8H5l-2 2V12a8 8 0 018-8h2a8 8 0 018 8z"/></svg>对话</button>
      <button class="tbtn" id="btnAi" title="AI 大脑设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l1.8 4.6L18 9l-4.2 1.4L12 15l-1.8-4.6L6 9l4.2-1.4z"/><path d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9z"/></svg>AI</button>
      <button class="tbtn" id="btnBak" title="导出备份"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg></button>
    </div>
  </div>

  <div class="main" id="mainGrid">
    <aside class="col side">
      <div class="sidehd">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 3v18"/></svg>
        <span>数据资产</span><span class="grow"></span>
        <button class="iconbtn" id="btnAddDir" title="添加扫描目录"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></button>
        <button class="iconbtn" id="btnTreeRefresh" title="刷新资产"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 11-3-6.7"/><path d="M21 3v5h-5"/></svg></button>
      </div>
      <div id="assetTree"><div class="emptyline">引擎未连接<br>请双击 <b style="color:var(--tx2)">start_desk.bat</b> 启动数据处理引擎</div></div>
      <div class="treefoot" id="scanBox">
        <div style="font-size:11px;color:var(--tx3)">台账 <b id="ledgerCnt" style="color:var(--tx2)">–</b> · 扫描目录</div>
        <div class="scanline" id="scanLine" style="display:none">
          <input id="scanInp" placeholder="粘贴目录路径，回车添加">
          <button class="act" id="scanOk" style="padding:3px 9px">添加</button>
        </div>
        <div class="chips" id="scanChips"></div>
      </div>
    </aside>

    <section class="col center">
      <div class="cview" id="cview">
        <div id="chatFlow"></div>
      </div>
      <div class="dataview" id="dataView">
        <div class="dvbar">
          <div class="dtabs" id="dvTabs">
            <button class="dtab" data-dv="k">知识库</button>
            <button class="dtab" data-dv="p">论文流</button>
            <button class="dtab" data-dv="n">我的积累</button>
          </div>
          <span style="flex:1"></span>
          <button class="tbtn" id="dvBack" style="padding:4px 10px">返回对话</button>
        </div>
        <div class="dvbody">
          <div class="dvlist" id="dvList"></div>
          <div class="dvdetail" id="dvDetail"></div>
        </div>
      </div>
    </section>

    <aside class="col detail" id="detailCol">
      <div class="detpane" id="detPane"><div class="detempty" id="detEmpty"></div></div>
    </aside>
  </div>

  <div class="cmdbar">
    <div class="cmdwrap">
      <span class="aiind" id="aiInd"></span>
      <input id="cmdInp" placeholder="问 AI / 敲命令，例如：把 umi 原始数据转成标准集、这批数据质量如何、把视频里的手去掉" autocomplete="off">
      <button class="sendbtn" id="btnSend" title="发送"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg></button>
    </div>
  </div>
</div>

<div class="overlay" id="ovAi">
  <div class="dialog">
    <h3>AI 大脑设置</h3>
    <div class="sub">对话由哪个大脑回答？可随时切换；不配置时按内置命令路由工作。</div>
    <div class="frow">
      <label>引擎</label>
      <select id="aiMode">
        <option value="off">关闭（内置命令路由）</option>
        <option value="ollama">本地 Ollama（公司 3090 / 家里 CPU）</option>
        <option value="openai">云端 OpenAI 兼容 API（DeepSeek/Qwen/GLM…）</option>
      </select>
    </div>
    <div style="display:flex;gap:6px;margin:-4px 0 12px">
      <button class="act" id="aiFillOllama" style="padding:3px 10px;font-size:12px">填入 Ollama 推荐值</button>
      <button class="act" id="aiFillDS" style="padding:3px 10px;font-size:12px">填入 DeepSeek 推荐值</button>
    </div>
    <div class="frow"><label>接口地址</label><input id="aiBase" placeholder="http://127.0.0.1:11434/v1 或 https://api.deepseek.com/v1">
      <span class="hint">Ollama 与多数国产平台都提供 OpenAI 兼容 /v1/chat/completions</span></div>
    <div class="frow"><label>模型名</label><input id="aiModel" placeholder="如 qwen2.5:14b / deepseek-chat"></div>
    <div class="frow"><label>API Key（本地 Ollama 可留空）</label><input id="aiKey" type="password" placeholder="sk-..."></div>
    <div class="dlgacts">
      <button class="act" id="aiTest">测试连接</button>
      <span style="flex:1"></span>
      <button class="act" id="aiCancel">取消</button>
      <button class="act prim" id="aiSave">保存</button>
    </div>
  </div>
</div>

<div class="errbar" id="errbar"></div>

<script src="data/knowledge.js" charset="utf-8"></script>
<script src="data/papers.js" charset="utf-8"></script>
<script>
"use strict";
/* ================= 基础工具 ================= */
var $id=function(i){return document.getElementById(i);};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function rel(t){if(!t)return"";var d=Date.now()/1000-t;if(d<90)return"刚刚";if(d<3600)return Math.round(d/60)+" 分钟前";if(d<86400)return Math.round(d/3600)+" 小时前";return Math.round(d/86400)+" 天前";}
function errbarShow(m){var e=$id("errbar");if(e){e.textContent=m;e.style.display="block";setTimeout(function(){e.style.display="none";},6000);}}
function copyText(t){try{navigator.clipboard.writeText(t);return true;}catch(e){return false;}}

/* ================= 数据层（知识/论文/笔记，兼容 v2 状态） ================= */
var LS_STATE="wb_ew_state",LS_NOTES="wb_ew_notes",LS_SEEDDONE="wb_ew_seed_v1",LS_AI="wb_ew_ai_v1";
var K=(window.WB_K||[]).slice(),P=(window.WB_P||[]).slice();
var Store={state:{},notes:[],selPath:null,view:"chat",dv:"k"};
function loadStore(){try{Store.state=JSON.parse(localStorage.getItem(LS_STATE))||{};}catch(e){Store.state={};}
  try{Store.notes=JSON.parse(localStorage.getItem(LS_NOTES))||[];}catch(e){Store.notes=[];}
  if(!localStorage.getItem(LS_SEEDDONE))seedNotes();}
function saveStore(){try{localStorage.setItem(LS_STATE,JSON.stringify(Store.state));localStorage.setItem(LS_NOTES,JSON.stringify(Store.notes));localStorage.setItem(LS_SEEDDONE,"1");}catch(e){errbarShow("本地存储失败：请先导出备份");}}
function seedNotes(){var t=Date.now();Store.notes=[
 {id:"n1",title:"采集字段命名对齐",tags:["约定"],pinned:true,done:false,ts:t,content:"动作列统一带 gripper 前缀可豁免关节型 QC 误报——这是 INGEST 与 03_clean 的衔接约定，写新适配器前先看 adapters/common.py 顶部注释。"},
 {id:"n2",title:"失败片段建库想法",tags:["飞轮"],pinned:false,done:false,ts:t,content:"把线上失败场景自动入台账并标『待补采』，是数据飞轮闭环的第一环——先打通 失败→入库 最小链路。"},
 {id:"n3",title:"家里机 LeRobot+ACT 验证",tags:["训练"],pinned:false,done:true,ts:t,content:"LeRobot 0.6.2 + Python3.12 装通；ACT CPU 训练 step3000 loss 3.1→0.97，验证『能跑』。公司 3090 再上真实规模。"}];
  saveStore();}
function pst(id){return Store.state[id]||{};}
function unreadN(){return P.filter(function(p){var s=pst(p.id);return !s.read&&!s.skip;}).length;}
function noteById(id){for(var i=0;i<Store.notes.length;i++)if(Store.notes[i].id===id)return Store.notes[i];return null;}

/* ================= AI 配置 ================= */
var AI={mode:"off",base:"",model:"",key:""};
function loadAI(){try{var c=JSON.parse(localStorage.getItem(LS_AI))||{};AI.mode=c.mode||"off";AI.base=c.base||"";AI.model=c.model||"";AI.key=c.key||"";}catch(e){}renderAiInd();}
function saveAI(){try{localStorage.setItem(LS_AI,JSON.stringify(AI));}catch(e){}renderAiInd();}
function renderAiInd(){var el=$id("aiInd");if(!el)return;
  if(AI.mode==="off")el.innerHTML="";else el.innerHTML="<b style=\"color:var(--green)\">AI·"+(AI.model||"…")+"</b>";}
function aiChat(messages,onDone){
  var ep=(AI.base||"").replace(/\/+$/,"")+"/chat/completions";
  fetch(ep,{method:"POST",headers:{"Content-Type":"application/json","Authorization":AI.key?("Bearer "+AI.key):""},
    body:JSON.stringify({model:AI.model,messages:messages,temperature:0.3,max_tokens:900})})
   .then(function(r){return r.json();})
   .then(function(d){if(d.error)throw new Error(d.error.message||JSON.stringify(d.error));onDone(null,(d.choices&&d.choices[0]&&d.choices[0].message.content)||"");})
   .catch(function(e){onDone(String(e&&e.message||e));});
}

/* ================= 引擎 ================= */
var Engine={url:(location.protocol==="http:"||location.protocol==="https:")?location.origin:"",live:false,items:[],dirs:[],base:[]};
function engineOK(){return Engine.url!==""&&Engine.live;}
function probeEngine(cb){if(!Engine.url){cb(false);return;}
  fetch(Engine.url+"/api/hello",{cache:"no-store"}).then(function(r){return r.json();})
   .then(function(d){Engine.live=!!(d&&d.ok);renderPill();cb(Engine.live);})
   .catch(function(){Engine.live=false;renderPill();cb(false);});}
function renderPill(){var el=$id("enginePill"),t=$id("engineTxt");if(!el)return;
  if(!Engine.url){el.className="pill off";t.textContent="浏览器直开（双击 start_desk.bat 启用引擎）";return;}
  if(Engine.live){el.className="pill on";t.textContent="引擎在线";}else{el.className="pill off";t.textContent="引擎未连接";}}
function apiGet(path,cb){if(!engineOK()){cb(null);return;}
  fetch(Engine.url+path,{cache:"no-store"}).then(function(r){return r.json();}).then(cb).catch(function(){cb(null);});}
function apiPost(path,body,cb){if(!engineOK()){cb({ok:false,log:"引擎未连接"});return;}
  fetch(Engine.url+path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body||{})})
   .then(function(r){return r.json();}).then(cb).catch(function(e){cb({ok:false,log:"调用失败 "+e});});}
function loadAssets(cb){apiGet("/api/batches",function(d){
    Engine.items=(d&&d.items)||[];renderTree();renderDetail();refreshScanBox();
    var lm=$id("ledgerCnt");if(lm)lm.textContent=d&&d.ledger?(d.ledger.split(/[\\\/]/).pop()||"—"):"—";
    if(cb)cb();});}
function loadScandirs(){apiGet("/api/scandirs",function(d){if(!d)return;Engine.dirs=d.dirs||[];Engine.base=d.base||[];renderScanChips();});}
function runTool(tool,target,onDone){addLogMsg("执行 "+tool+" → "+(target||"").split(/[\\\/]/).pop());
  apiPost("/api/run",{tool:tool,target:target},function(d){
    var ok=!!(d&&d.ok),log=(d&&d.log)||"无返回";
    appendRunResult(tool,target,ok,log);
    setTimeout(function(){loadAssets();},600);
    if(ok)toolDone(tool,target);
    if(onDone)onDone(ok,log);});}

/* 工具成功后的"人话收尾"（无 AI 也成立：规则总结；报告解读走 qcmsg） */
function qcGet(target,cb){if(!engineOK()){cb(null);return;}
  fetch(Engine.url+"/api/qcmsg?target="+encodeURIComponent(target),{cache:"no-store"})
    .then(function(r){return r.json();}).then(cb).catch(function(){cb(null);});}
function summarizeClean(target){
  qcGet(target,function(d){
    if(!d||!d.ok)return;
    if(!d.n_excluded){addMsg({who:"a",text:"清洗(03)完成："+d.n_total+" 集全部通过（0 排除）。可继续：校验(07) → 打包(08) → 登记台账。"});return;}
    var lines=["清洗(03)完成：有 "+d.n_excluded+" 集被标记排除——"];
    d.items.forEach(function(it){lines.push("· ep"+it.ep+"："+it.reasons.join("；"));});
    lines.push("");lines.push("建议："+d.advice_all);
    lines.push("（05 合并时这些集会被自动剔除；想复核细节看右侧面板）");
    addMsg({who:"a",text:lines.join("\n")});});}
function toolDone(tool,target){
  var nm=(target||"").split(/[\\\/]/).pop();
  if(tool==="clean"){summarizeClean(target);}
  else if(tool==="dehand"){addMsg({who:"a",text:"去手(10)完成 → 输出 "+nm+"_nohand 副本（无手帧原样拷贝不重编码，有手帧已盖板）。刷新左侧「标准数据集」查看。"});}
  else if(tool==="ingest"){addMsg({who:"a",text:"INGEST 转换完成 ✓ 刷新左侧「标准数据集」会出现新集，可继续清洗/校验/打包。"});}
  else if(tool==="verify"){addMsg({who:"a",text:"校验(07)通过 ✓ "+(nm)+" 结构完整、帧数一致，可以打包或登记了。"});}
  else if(tool==="pack"){addMsg({who:"a",text:"打包(08)完成 ✓ 交付 tar.gz + sha256 清单已生成，可送训练机。"});}
  else if(tool==="record"){addMsg({who:"a",text:"已登记台账 ✓ 该批次进入 data_catalog。"});}
  else if(tool==="inspect"){addMsg({who:"a",text:"盘点(01)完成 ✓ 每集统计与视频对齐信息已生成。"});}}

/* ================= 资产树 ================= */
var SRC_LABEL={umi:["UMI 手持",2],ego:["Ego 穿戴",1],sim:["仿真",3],teleop:["遥操作",0]};
function srcTy(st){return SRC_LABEL[st]?st:(st==="innov"||st==="arm")?"teleop":"sim";}
function itemRow(it){
  var sub,tagcls="",tagtxt="",flag="";
  if(it.kind==="raw"){
    var st=srcTy(it.source_type);var L=SRC_LABEL[st]||["源",0];
    tagcls="ty "+st;tagtxt=L[0];
    sub=(it.n_demos!=null?it.n_demos+" 段 demo · ":"")+rel(it.updated_ts);
  }else{
    tagcls="ty "+(it.format==="v3.0"?"v30":"v21");tagtxt=it.format;
    var ep=it.episodes!=null?it.episodes+" 集 · ":"";
    var rob=it.robot&&it.robot!=="?"?it.robot+" · ":"";
    sub=ep+rob+rel(it.updated_ts);
    if(it.quality&&it.quality.excluded>0)flag="<span class=\"flag bad\">清洗排除 "+it.quality.excluded+"</span>";
    else if(it.quality&&it.quality.warnings>0)flag="<span class=\"flag warn\">校验警告 "+it.quality.warnings+"</span>";
  }
  var steps="";
  if(it.kind==="dataset"){var ss=it.steps||{};steps="<span class=\"steps\"><i class=\""+(ss.ingest?"on":"")+"\" title=\"转换\"></i><i class=\""+(ss.clean?"on":"")+"\" title=\"清洗\"></i><i class=\""+(ss.verify?"on":"")+"\" title=\"校验\"></i><i class=\""+(ss.pack?"on":"")+"\" title=\"打包\"></i></span>";}
  return "<div class=\"aitem\" data-path=\""+esc(it.path)+"\"><div class=\"row1\"><span class=\"ty "+tagcls+"\">"+tagtxt+"</span><span class=\"nm\">"+esc(it.name)+"</span>"+steps+"</div><div class=\"row2\">"+esc(sub)+"</div>"+flag+"</div>";
}
function renderTree(){var el=$id("assetTree");if(!el)return;
  if(!engineOK()){el.innerHTML="<div class=\"emptyline\">引擎未连接<br>双击 <b style=\"color:var(--tx2)\">start_desk.bat</b> 启动后自动加载</div>";return;}
  var raws=[],dss=[];
  Engine.items.forEach(function(it){if(it.kind==="raw")raws.push(it);else dss.push(it);});
  var h="";
  h+="<div class=\"treegrp\">原始源 <span class=\"cnt\">"+raws.length+"</span></div>";
  h+=raws.length?raws.map(itemRow).join(""):"<div class=\"emptyline\">还没有原始源——采集数据拷入扫描目录后点刷新</div>";
  h+="<div class=\"treegrp\">标准数据集 <span class=\"cnt\">"+dss.length+"</span></div>";
  h+=dss.length?dss.map(itemRow).join(""):"<div class=\"emptyline\">原始源 INGEST 转换后出现在这里</div>";
  el.innerHTML=h;
  el.querySelectorAll(".aitem").forEach(function(n){n.addEventListener("click",function(){selectAsset(n.dataset.path);});});
  if(Store.selPath){var hit=el.querySelector('[data-path="'+cssEsc(Store.selPath)+'"]');if(hit)hit.classList.add("sel");}
}
function cssEsc(s){return String(s).replace(/[\\"']/g,function(c){return "\\"+c;});}
function findItem(path){for(var i=0;i<Engine.items.length;i++)if(Engine.items[i].path===path)return Engine.items[i];return null;}
function selectAsset(path){Store.selPath=path;setDetail(path);showDetail(true);
  var el=$id("assetTree");if(el){el.querySelectorAll(".aitem.sel").forEach(function(n){n.classList.remove("sel");});
    var hit=el.querySelector('[data-path="'+cssEsc(path)+'"]');if(hit)hit.classList.add("sel");}}

/* ================= 右栏详情 ================= */
var PipeSteps=[["ingest","转换"],["clean","清洗"],["verify","校验"],["pack","打包"]];
function showDetail(on){var g=$id("mainGrid");if(g)g.classList.toggle("showdetail",!!on);
  if(!on&&$id("detPane"))$id("detPane").innerHTML="";}
function detEmptyHTML(){return "<div style=\"font-size:14px;font-weight:500;color:var(--tx2)\">这里显示数据详情</div>"+
 "<div>在左侧点选一个原始源或数据集，右侧会显示它的全部信息与可执行动作；也可以直接在底部输入框问我。</div>"+
 "<div class=\"qh\">我可以帮你</div>"+
 "<span class=\"qchip\" onclick=\"quickAsk('umidata')\">UMI 数据怎么转</span><span class=\"qchip\" onclick=\"quickAsk('quality')\">这批数据质量如何</span><span class=\"qchip\" onclick=\"quickAsk('dehand')\">把视频里的手去掉</span>";}
function detActs(it){var bs=[];
  if(it.kind==="raw")bs.push(["ingest","转为标准集 (INGEST)",true]);
  else{PipeSteps.forEach(function(s){var done=(it.steps||{})[s[0]];
      var lb=(TOOLNAME[s[0]]||s[1]);if(done)lb="重跑 · "+s[1];
      bs.push([s[0],lb,false]);});
    bs.push(["dehand","去手处理(10)",false]);bs.push(["record","登记台账",false]);}
  return bs.map(function(b){return "<button class=\"act\" data-tool=\""+b[0]+"\" data-target=\""+esc(it.path)+"\">"+b[1]+"</button>";}).join("");}
function setDetail(path){var p=$id("detPane");if(!p)return;
  var it=findItem(path);
  if(!it){p.innerHTML="<div class=\"detempty\">未找到该资产（可能已从磁盘移除）</div>";return;}
  var h="";
  if(it.kind==="raw"){
    var st=srcTy(it.source_type),L=SRC_LABEL[st]||[st,0];
    h+="<div style=\"margin-bottom:8px\"><span class=\"ty "+st+"\">"+L[0]+"</span></div>";
    h+="<h2>"+esc(it.name)+"</h2>";
  }else{h+="<div style=\"margin-bottom:8px\"><span class=\"ty "+(it.format==="v3.0"?"v30":"v21")+"\">"+it.format+"</span>"+(it.robot&&it.robot!=="?"?" <span style=\"color:var(--tx2);font-size:12px\">"+esc(it.robot)+"</span>":"")+"</div>";
    h+="<h2>"+esc(it.name)+"</h2>";}
  h+="<div class=\"kv\">";
  h+="<div class=\"r\"><span class=\"k\">路径</span><span class=\"v\">"+esc(it.path)+"</span></div>";
  if(it.kind==="dataset"){h+="<div class=\"r\"><span class=\"k\">规模</span><span class=\"v\">"+esc(it.episodes!=null?it.episodes+" 集":"?")+(it.frames?" · "+it.frames+" 帧":"")+(it.fps?" · "+it.fps+"fps":"")+"</span></div>";}
  else{h+="<div class=\"r\"><span class=\"k\">内容</span><span class=\"v\">"+(it.n_demos!=null?it.n_demos+" 段 demo":"?")+esc(it.task?" · 任务 "+it.task:"")+"</span></div>";}
  if(it.kind==="dataset"&&it.cams&&it.cams.length)h+="<div class=\"r\"><span class=\"k\">相机</span><span class=\"v\">"+it.cams.join("、")+"</span></div>";
  h+="<div class=\"r\"><span class=\"k\">更新</span><span class=\"v\">"+rel(it.updated_ts)+"</span></div>";
  h+="</div>";
  if(it.kind==="dataset"){
    var ss=it.steps||{},q=it.quality||{};
    var dones=0;PipeSteps.forEach(function(s){if(ss[s[0]])dones++;});
    h+="<div class=\"plab\"><span>处理进度 "+dones+"/4</span></div><div class=\"pipebar\">";
    PipeSteps.forEach(function(s){var on=ss[s[0]];h+="<span class=\"seg"+(on?" on":"")+"\" title=\""+s[1]+"\"></span>";});
    h+="</div>";
    if(q.excluded!=null)h+="<div class=\"qrow "+(q.excluded>0?"bad":"ok")+"\"><span class=\"v\">"+(q.excluded>0?"清洗排除 "+q.excluded+" 集（05 合并时自动剔除）":"清洗通过 0 排除")+"</span></div>"+(q.excluded>0?"<div class=\"qchuman\" data-qc=\""+esc(it.path)+"\">加载解读…</div>":"");
    if(q.warnings!=null)h+="<div class=\"qrow "+(q.warnings>0?"warn":"ok")+"\"><span class=\"v\">"+esc("校验 "+(q.warnings>0?q.warnings+" 条警告":"通过 0 警告"))+"</span></div>";
    h+="<div class=\"pacts\">"+detActs(it)+"</div>";
  }else{h+="<div class=\"qrow\"><span class=\"v\" style=\"color:var(--tx2)\">原始数据：INGEST 转换后即可进入清洗/校验/打包链</span></div>";
    h+="<div class=\"pacts\">"+detActs(it)+"</div>";}
  h+="<div class=\"plab\" style=\"margin-top:14px\"><span>对我说</span></div>";
  h+="<span class=\"qchip\" onclick=\"quickAsk('pick','"+esc(it.name)+"')\">处理 "+esc(it.name)+"</span>";
  h+="<span class=\"qchip\" onclick=\"quickAsk('quality','"+esc(it.name)+"')\">质量如何</span>";
  if(it.kind==="dataset")h+="<span class=\"qchip\" onclick=\"quickAsk('dehand','"+esc(it.name)+"')\">去手</span>";
  p.innerHTML=h;
  p.querySelectorAll(".act[data-tool]").forEach(function(b){b.addEventListener("click",function(){runTool(b.dataset.tool,b.dataset.target);});});
  var qcEl=p.querySelector(".qchuman");if(qcEl)fillQcHuman(qcEl.dataset.qc,qcEl);
}
function fillQcHuman(target,el){
  qcGet(target,function(d){
    if(!el||!el.isConnected)return;
    if(!d||!d.ok){el.innerHTML="<span style=\"color:var(--tx3)\">解读不可用</span>";return;}
    if(!d.n_excluded){el.innerHTML="<span style=\"color:var(--tx2)\">✓ "+d.n_total+" 集全部通过</span>";return;}
    var h="<div style=\"color:var(--amber);margin-bottom:4px\">清洗排除明细（原因与建议）：</div>";
    d.items.forEach(function(it){h+="<span class=\"qc-ep\">ep"+esc(it.ep)+"</span>：<span class=\"qc-r\">"+esc(it.reasons.join("；"))+"</span>";
      (it.advice||[]).forEach(function(a){h+="<span class=\"qc-a\">→ "+esc(a)+"</span>";});});
    el.innerHTML=h;});}
function quickAsk(kind,extra){var map={quality:"这批数据质量如何，帮我看看有哪些问题",dehand:"把视频里的人手去掉（去手处理）",pick:"帮我看下 "+extra,umidata:"UMI 手持数据是怎么转成机械臂能用的标准集的？"};cmdSend(map[kind]||"帮我看看数据情况");}

/* ================= 扫描目录 ================= */
function refreshScanBox(){var sl=$id("scanLine");if(sl&&engineOK())sl.style.display="flex";
  loadScandirs();}
function renderScanChips(){var el=$id("scanChips");if(!el)return;
  var h="";
  Engine.base.forEach(function(d){h+="<span class=\"chip\" title=\""+esc(d)+"\"><b>默认</b></span>";});
  Engine.dirs.forEach(function(d){h+="<span class=\"chip\">"+esc(d.split(/[\\\/]/).filter(Boolean).slice(-2).join("/"))+" <button data-rm=\""+esc(d)+"\">✕</button></span>";});
  el.innerHTML=h||"";
  el.querySelectorAll("button[data-rm]").forEach(function(b){b.addEventListener("click",function(){apiPost("/api/scandirs",{dir:b.dataset.rm,remove:true},function(){loadAssets();});});});
}

/* ================= 对话 ================= */
var Msgs=[];var flowEl=null;
function scrollCv(){var cv=$id("cview");if(cv)cv.scrollTop=cv.scrollHeight;}
function addMsg(m){Msgs.push(m);renderMsgs();scrollCv();}
function renderMsgs(){var el=$id("chatFlow");if(!el)return;
  el.innerHTML=Msgs.map(function(m,i){
    var who=m.who==="u"?"u":"a",bd="";
    if(m.kind==="welcome"){bd="<div class=\"hello\"><h1>"+esc(m.title)+"</h1><p>"+esc(m.sub)+"</p></div>"+
      "<div class=\"statline\">"+m.stats.map(function(s){return "<div class=\"stat\"><b class=\""+s.c+"\">"+s.n+"</b><span>"+s.l+"</span></div>";}).join("")+"</div>"+
      "<div class=\"quickwrap\">"+m.acts.map(function(a){return "<span class=\"qchip\" data-quick=\""+esc(a.k)+"\">"+esc(a.l)+"</span>";}).join("")+"</div>";}
    else{bd="<div class=\"bd\">"+esc(m.text)+"</div>";}
    var acts="";
    if(m.acts&&m.acts.length)acts="<div class=\"actrow\">"+m.acts.map(function(a){
      return "<button class=\"act"+(a.prim?" prim":"")+"\" data-mi=\""+i+"\" data-ai=\""+esc(JSON.stringify(a))+"\">"+esc(a.label)+"</button>";}).join("")+"</div>";
    var log=m.log?"<div class=\"logbox\">"+esc(m.log)+"</div>":"";
    var meta=m.meta?"<div class=\"meta\">"+esc(m.meta)+"</div>":"";
    return "<div class=\"msg "+who+"\"><div class=\"who\">"+(m.who==="u"?"我":"AI")+"</div><div class=\"bubble\">"+bd+acts+log+meta+"</div></div>";

function pickTargets(text,kinds){var out=[];
  var named=null;
  Engine.items.forEach(function(it){if(text.indexOf(it.name)>-1&&(!kinds||kinds.indexOf(it.kind)>-1)){named=it;}});
  if(named){out.push(named);return out;}
  if(Store.selPath){var s=findItem(Store.selPath);if(s&&(!kinds||kinds.indexOf(s.kind)>-1)){out.push(s);return out;}}
  Engine.items.forEach(function(it){if(it.kind==="dataset"&&(!kinds||kinds.indexOf(it.kind)>-1)){out.push(it);}});
  if(!out.length)Engine.items.forEach(function(it){if(it.kind==="raw"&&(!kinds||kinds.indexOf(it.kind)>-1))out.push(it);});
  return out.slice(0,4);}
function srcOf(it){return it.source_type||"teleop";}
function resolveIntent(text){
  var t=text.toLowerCase();var out={tool:null,text:""};
  if(t.indexOf("umi")>-1||t.indexOf("ego")>-1||t.indexOf("仿真")>-1||t.indexOf("sim")>-1||t.indexOf("遥操作")>-1||t.indexOf("teleop")>-1){
    if(/转|转换|标准|ingest|变成|处理/.test(text)){
      var want=t.indexOf("umi")>-1?"umi":t.indexOf("ego")>-1?"ego":t.indexOf("sim")>-1||t.indexOf("仿真")>-1?"sim":"teleop";
      var raws=Engine.items.filter(function(x){return x.kind==="raw"&&srcOf(x)===want;});
      if(raws.length){out.tool="ingest";out.targets=raws;return out;}
      return {tool:null,text:"没有找到 "+(SRC_LABEL[want]?SRC_LABEL[want][0]:"该类型")+" 的原始源。先把采集数据放进扫描目录（左下角添加），或确认路径。"};}
  }
  if(/去手|去掉手|抹掉|人手|手臂|hand|去手处理/.test(text)){out.tool="dehand";
    out.targets=pickTargets(text,["dataset"]);return out;}
  if(/清洗|质量|坏集|质检|clean|排除/.test(text)){out.tool="clean";
    out.targets=pickTargets(text,["dataset"]);return out;}
  if(/校验|verify|检查.*数据|通过性/.test(text)){out.tool="verify";out.targets=pickTargets(text,["dataset"]);return out;}
  if(/打包|交付|tar|pack|训练机/.test(text)){out.tool="pack";out.targets=pickTargets(text,["dataset"]);return out;}
  if(/登记|台账|record|catalog|入库/.test(text)){out.tool="record";out.targets=pickTargets(text,["dataset"]);return out;}
  if(/盘点|统计|inspect|逐集/.test(text)){out.tool="inspect";out.targets=pickTargets(text,["dataset"]);return out;}
  if(/概况|概况|有哪些|列表|list|看看.*数据|状态/.test(text)&&Engine.items.length){return {tool:"overview",targets:null};}
  if(/刷新|refresh/.test(text)){return {tool:"refresh",targets:null};}
  return null;}

function doGlobalSearch(){var q=($id("searchInp").value||"").trim();if(!q)return;
  var ql=q.toLowerCase();
  var hits={assets:[],papers:[],kb:[],notes:[]};
  Engine.items.forEach(function(it){if((it.name+it.path).toLowerCase().indexOf(ql)>-1)hits.assets.push(it);});
  P.forEach(function(p){if((p.title+" "+p.summary).toLowerCase().indexOf(ql)>-1)hits.papers.push(p);});
  K.forEach(function(k){if((k.title+" "+k.summary+" "+k.detail).toLowerCase().indexOf(ql)>-1)hits.kb.push(k);});
  Store.notes.forEach(function(n){if((n.title+" "+n.content).toLowerCase().indexOf(ql)>-1)hits.notes.push(n);});

  if(hits.kb.length)lines.push("● 知识卡 "+hits.kb.length+" 张");
  if(hits.notes.length)lines.push("● 笔记 "+hits.notes.length+" 条");
  var m={who:"a",text:lines.length?("找到以下内容（"+q+"）：\n"+lines.join("\n")):"没有找到与『"+q+"』匹配的内容。"};
  hits.assets.slice(0,4).forEach(function(a){pushAct(m,{label:"资产 "+a.name,tool:"detail",target:a.path});});
  hits.papers.slice(0,3).forEach(function(p){pushAct(m,{label:"论文 "+p.title.slice(0,18),tool:"open",url:p.url});});
  hits.kb.slice(0,3).forEach(function(k){pushAct(m,{label:"知识 "+k.title,tool:"kb",id:k.id});});
  addMsg({who:"u",text:"搜索："+q});

  $id("aiCancel").addEventListener("click",closeAiDlg);
  $id("aiFillOllama").addEventListener("click",function(){$id("aiMode").value="ollama";
    $id("aiBase").value="http://127.0.0.1:11434/v1";$id("aiModel").value="qwen2.5:14b";$id("aiKey").value="";
    errbarShow("已填入 Ollama 推荐值（公司机先跑 tools/setup_ai.sh 拉模型）");});
  $id("aiFillDS").addEventListener("click",function(){$id("aiMode").value="openai";
    $id("aiBase").value="https://api.deepseek.com/v1";$id("aiModel").value="deepseek-chat";
    errbarShow("已填入 DeepSeek 端点，请在 Key 栏粘贴你在 platform.deepseek.com 申请的 API Key");});
  $id("aiSave").addEventListener("click",function(){AI.mode=$id("aiMode").value;AI.base=$id("aiBase").value.trim();AI.model=$id("aiModel").value.trim();AI.key=$id("aiKey").value.trim();saveAI();closeAiDlg();addMsg({who:"a",text:AI.mode==="off"?"已切回内置命令路由。":"AI 大脑已设为 "+(AI.model||AI.base)+"。"});});
  $id("aiTest").addEventListener("click",function(){var mode=$id("aiMode").value,base=$id("aiBase").value.trim(),model=$id("aiModel").value.trim(),key=$id("aiKey").value.trim();
    if(!base||!model){errbarShow("先填接口地址与模型名");return;}
    $id("aiTest").textContent="测试中…";
    aiChat([{role:"user",content:"回复两个字：在的"}],function(err){$id("aiTest").textContent="测试连接";
      if(err)errbarShow("连接失败："+err);else errbarShow("连接成功 ✓（"+model+"）");});});
  $id("btnBak").addEventListener("click",function(){var blob=new Blob([JSON.stringify({state:Store.state,notes:Store.notes,K:K,P:P,ts:Date.now()},null,1)],{type:"application/json"});
    var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="desk-backup-"+new Date().toISOString().slice(0,10)+".json";a.click();addMsg({who:"a",text:"已导出备份（含阅读状态、笔记与数据快照）。换电脑后可用页面脚本导入。"});});
  $id("ovAi").addEventListener("click",function(e){if(e.target===$id("ovAi"))closeAiDlg();});
}
function addScanDir(){var v=$id("scanInp").value.trim();if(!v)return;
  apiPost("/api/scandirs",{dir:v},function(d){if(d&&d.ok){$id("scanInp").value="";loadAssets();addMsg({who:"a",text:"已添加扫描目录，资产列表已刷新。"});}else{errbarShow((d&&d.error)||"添加失败");}});}

function boot(){
  try{
    loadStore();loadAI();
    renderPill();
    bindEvents();
    setView("chat");
    switchDv("k");
    var h0=(location.hash||"").replace("#","");
    if(h0==="data")setView("data");
    var wm=welcomeMsg();Msgs.push(wm);
    var el=$id("chatFlow");if(el)renderMsgs();
    if(h0==="k"){setView("data");switchDv("k");}if(h0==="p"){setView("data");switchDv("p");}
    if(!Engine.url){renderTree();scrollCv();return;}
    probeEngine(function(ok){
      var i=Msgs.findIndex(function(m){return m.kind==="welcome";});
      if(ok){
        loadAssets(function(){
          var j=Msgs.findIndex(function(m){return m.kind==="welcome";});
          if(j>=0){Msgs[j]=welcomeMsg();}renderMsgs();renderTree();scrollCv();});
      }else{
        if(i>=0){Msgs[i]=welcomeMsg();}
        renderMsgs();renderTree();scrollCv();
      }
    });
    scrollCv();
  }catch(e){errbarShow("启动异常："+e.message+"（可把这段发给我排查）");console.error(e);}
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);else boot();
</script>
