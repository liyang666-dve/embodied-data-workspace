<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>具身智能数据工作台</title>
<style>
:root{
  --bg:#0A0F1C; --bg2:#0E1626; --panel:#111B2E; --panel2:#16233B; --panel3:#1B2B47;
  --line:rgba(148,175,214,.14); --line2:rgba(148,175,214,.26);
  --txt:#E7EDF7; --sub:#9DB0CC; --weak:#5D7296;
  --blue:#4C8DFF; --violet:#8B7CFF; --teal:#2FD9A2; --green:#43C98A; --amber:#F5B544;
  --red:#FF6161; --pink:#F06FA9;
  --blue-bg:rgba(76,141,255,.14); --teal-bg:rgba(47,217,162,.13); --violet-bg:rgba(139,124,255,.14);
  --green-bg:rgba(67,201,138,.14); --amber-bg:rgba(245,181,68,.14); --red-bg:rgba(255,97,97,.14); --pink-bg:rgba(240,111,169,.14);
  --r:12px; --mono:Consolas,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);font-size:14px;line-height:1.55;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--txt);background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:9px 12px;outline:none;width:100%}
input:focus,textarea:focus,select:focus{border-color:var(--blue)}
a{color:var(--blue);text-decoration:none}
.icon{display:inline-flex;flex:none;width:16px;height:16px;vertical-align:-3px}
.icon svg{width:100%;height:100%}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#24344F;border-radius:6px}::-webkit-scrollbar-track{background:transparent}
::selection{background:rgba(76,141,255,.35)}

.app{display:grid;grid-template-columns:236px 1fr;height:100vh}

/* ===== 左导航 ===== */
.side{background:linear-gradient(180deg,#0D1526 0%,#0B1220 100%);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 14px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--blue),var(--violet));display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 4px 14px rgba(76,141,255,.35)}
.logo .icon{width:18px;height:18px;color:#fff}
.brand .t1{font-size:14px;font-weight:600;letter-spacing:.3px;white-space:nowrap}
.brand .t2{font-size:11px;color:var(--weak);white-space:nowrap}
.nav{flex:1;padding:4px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.nav-it{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;color:var(--sub);font-size:13.5px;min-height:42px;text-align:left;position:relative}
.nav-it .icon{color:var(--weak)}
.nav-it:hover{background:rgba(148,175,214,.07);color:var(--txt)}
.nav-it.on{background:var(--blue-bg);color:#DCE9FF}
.nav-it.on .icon{color:var(--blue)}
.nav-it .bdg{margin-left:auto;font-size:11px;background:var(--panel3);border:1px solid var(--line);color:var(--sub);border-radius:999px;padding:0 8px;min-width:22px;text-align:center}
.nav-it.on .bdg{background:var(--blue);border-color:var(--blue);color:#fff}
.side-foot{padding:12px;border-top:1px solid var(--line);display:flex;gap:6px;justify-content:space-between}
.side-foot button{flex:1;min-height:36px;border-radius:8px;font-size:12px;color:var(--sub);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:6px;padding:0 6px}
.side-foot button:hover{color:var(--txt);border-color:var(--line2)}
.side-foot .dng:hover{color:var(--red);border-color:var(--red)}

/* ===== 主区 ===== */
.main{display:flex;flex-direction:column;min-width:0;height:100vh}
.top{display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid var(--line);background:rgba(14,22,38,.72);backdrop-filter:blur(8px);flex-wrap:wrap;min-height:60px}
.ttl{font-size:16px;font-weight:600;white-space:nowrap}
.ttl .cnt{font-size:12px;color:var(--weak);font-weight:400;margin-left:8px}
.tsearch{flex:1 1 240px;max-width:420px;position:relative;margin-left:auto}
.tsearch .icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--weak)}
.tsearch input{padding-left:34px;min-height:38px;font-size:14px}
.tbtns{display:flex;gap:8px;align-items:center}
.tbtn{min-height:38px;min-width:38px;border-radius:9px;border:1px solid var(--line);color:var(--sub);display:inline-flex;align-items:center;gap:6px;padding:0 12px;font-size:13px}
.tbtn:hover{color:var(--txt);border-color:var(--line2);background:var(--panel2)}
.tbtn.acc{background:var(--blue);border-color:var(--blue);color:#fff}
.tbtn.acc:hover{filter:brightness(1.1)}
.tbtn .icon{width:15px;height:15px}
.todaybar{display:flex;gap:10px;padding:10px 18px 0;flex-wrap:wrap}
.tchip{display:inline-flex;align-items:center;gap:8px;border-radius:10px;padding:7px 13px;font-size:13px;min-height:38px;cursor:pointer;border:1px solid transparent;color:var(--sub)}
.tchip .n{font-weight:700;font-size:15px}
.tchip:hover{border-color:var(--line2)}
.tchip.ov{background:var(--red-bg);color:#FFD9D4}.tchip.ov .n{color:var(--red)}
.tchip.new{background:var(--blue-bg);color:#D5E6FF}.tchip.new .n{color:var(--blue)}
.tchip.star{background:var(--amber-bg);color:#FFE9BE}.tchip.star .n{color:var(--amber)}

.content{flex:1;overflow-y:auto;padding:14px 18px 90px}
.panel{display:none;animation:fade .16s ease}
.panel.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--sub);border-radius:999px;padding:6px 12px;font-size:12.5px;min-height:34px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.chip:hover{border-color:var(--line2);color:var(--txt)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chip .n{font-size:11px;opacity:.72}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:6px 13px;border-radius:7px;font-size:12.5px;color:var(--sub);min-height:32px;white-space:nowrap}
.seg button.on{background:var(--blue-bg);color:#DCE9FF}
.toolrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:2px 0 12px}

/* 主从分栏通用 */
.split{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:14px;align-items:start}
.left-col{min-width:0}
.right-col{min-width:0;position:sticky;top:2px;max-height:calc(100vh - 130px);overflow:auto}

/* ===== 知识库 ===== */
.krow{display:flex;gap:11px;align-items:center;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px 13px;margin-bottom:7px;min-height:52px;transition:border-color .12s}
.krow:hover{border-color:var(--line2)}
.krow.sel{border-color:var(--blue);background:linear-gradient(90deg,var(--blue-bg),transparent 60%)}
.kdot{width:10px;height:10px;border-radius:3px;flex:none}
.krow .kt{font-size:13.5px;font-weight:500;color:var(--txt);line-height:1.35}
.krow .ks{font-size:12px;color:var(--weak);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.krow .kr{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none}
.krow .kcat{font-size:10.5px;border-radius:999px;padding:2px 9px;flex:none}

/* 右侧详情 */
.detail{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.detail .dph{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.detail h3{font-size:17px;line-height:1.4}
.detail .dmeta{font-size:12px;color:var(--weak);margin-bottom:12px;display:flex;gap:8px;flex-wrap:wrap}
.detail .dsum{font-size:13.5px;color:#C6D5EA;background:var(--bg2);border-left:3px solid var(--blue);padding:10px 12px;border-radius:0 9px 9px 0;margin-bottom:12px}
.dlist{list-style:none;display:flex;flex-direction:column;gap:7px;margin-bottom:12px}
.dlist li{position:relative;padding-left:16px;font-size:13px;color:#C3D2E6}
.dlist li::before{content:"";position:absolute;left:2px;top:8px;width:6px;height:6px;border-radius:2px;background:var(--blue)}
.related{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.related .rl{font-size:12.5px;color:var(--sub);display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;cursor:pointer;min-height:34px}
.related .rl:hover{background:var(--blue-bg)}
.related .rl .ar{margin-left:auto;color:var(--weak);font-size:11px}
.placeholder{color:var(--weak);text-align:center;padding:60px 10px;font-size:13px}
.cat{font-size:10.5px;padding:2px 9px;border-radius:999px;white-space:nowrap}
.cat.collection{background:var(--blue-bg);color:#9CC2FF}
.cat.processing{background:var(--green-bg);color:#7FE0AE}
.cat.format{background:var(--amber-bg);color:#FFD98A}
.cat.tools{background:var(--violet-bg);color:#B8ADFF}
.cat.model{background:var(--pink-bg);color:#FF9CC8}
.cat.teleop{background:var(--blue-bg);color:#9CC2FF}
.cat.umi{background:var(--teal-bg);color:#7CE8C6}
.cat.ego{background:var(--violet-bg);color:#B8ADFF}
.cat.sim{background:var(--amber-bg);color:#FFD98A}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{background:var(--panel3);border:1px solid var(--line);color:var(--sub);border-radius:6px;padding:0 7px;font-size:11px}

/* ===== 论文流 ===== */
.prow{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px 13px;margin-bottom:7px;min-height:58px;transition:border-color .12s;cursor:pointer}
.prow:hover{border-color:var(--line2)}
.prow.sel{border-color:var(--blue);background:linear-gradient(90deg,var(--blue-bg),transparent 60%)}
.prow .st{margin-top:4px}
.prow .pt{font-size:13.5px;font-weight:500;color:var(--txt);line-height:1.4}
.prow .pm{font-size:11.5px;color:var(--weak);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
.prow .pm .dt{color:var(--weak)}
.prow .pl{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.prow .pl .sttags{display:flex;gap:4px;justify-content:flex-end;flex-wrap:wrap}
.star-mark{color:var(--amber);font-size:14px}
.unread-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--blue)}
.read-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2A3B57}
.pgroup .ghead{font-size:12px;color:var(--weak);display:flex;align-items:center;gap:10px;margin:10px 0 6px}
.pgroup .ghead::after{content:"";flex:1;height:1px;background:var(--line)}
.pgroup:first-child .ghead{margin-top:0}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.bcard{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px 12px;cursor:pointer;min-height:96px;display:flex;flex-direction:column;gap:6px}
.bcard:hover{border-color:var(--line2)}
.bcard.sel{border-color:var(--blue);background:linear-gradient(160deg,var(--blue-bg),transparent 55%)}
.bcard .bt{font-size:12.5px;line-height:1.45;color:var(--txt);font-weight:500;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.bcard .bm{font-size:11px;color:var(--weak);margin-top:auto;display:flex;justify-content:space-between;align-items:center}
.pdetail .pd-title{font-size:16px;line-height:1.45;font-weight:600}
.pdetail .pd-meta{font-size:12px;color:var(--weak);margin:8px 0;display:flex;gap:8px;flex-wrap:wrap}
.pdetail .pd-sum{font-size:13.5px;color:#C6D5EA;line-height:1.7}
.pd-acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}

/* ===== 笔记 ===== */
.n-form{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:12px}
.n-form .fr{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.n-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:9px}
.n-card.pinned{border-left:3px solid var(--amber)}
.n-card .nt{font-size:13.5px;font-weight:600}
.n-card.done .nt{color:var(--weak);text-decoration:line-through}
.n-card .nd{font-size:13px;color:var(--sub);white-space:pre-line;margin-top:5px}
.n-card .nm{font-size:11.5px;color:var(--weak);margin-top:7px;display:flex;gap:10px;flex-wrap:wrap}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.act{border:1px solid var(--line);background:var(--panel2);color:var(--sub);border-radius:8px;padding:6px 12px;font-size:12.5px;min-height:34px;display:inline-flex;align-items:center;gap:6px}
.act:hover{border-color:var(--line2);color:var(--txt)}
.act.on{background:var(--amber-bg);border-color:rgba(245,181,68,.4);color:#FFD98A}
.act.acc{background:var(--blue);border-color:var(--blue);color:#fff}
.act.acc:hover{filter:brightness(1.12)}
.act.danger{color:#FF9B9B;border-color:rgba(255,97,97,.35)}
.act.danger:hover{background:var(--red-bg)}
.add-b{background:var(--blue);color:#fff;border-radius:10px;padding:0 18px;font-size:14px;min-height:42px;display:inline-flex;align-items:center;gap:6px}
.edit-area{margin-top:9px;display:flex;flex-direction:column;gap:8px}

/* ===== 数据处理中心 ===== */
.dp-src{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.src-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.src-card .sname{font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px;margin-bottom:8px}
.src-card .snum{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.src-card .snote{font-size:11.5px;color:var(--weak);margin-top:3px}
.sc-blue{color:var(--blue)}.sc-teal{color:var(--teal)}.sc-violet{color:var(--violet)}.sc-amber{color:var(--amber)}
.pipe-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:10px}
.pipe-card .ph{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.pipe-card .pname{font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pipe-card .pm{font-size:11.5px;color:var(--weak);margin-top:6px;display:flex;gap:10px;flex-wrap:wrap}
.prog{display:flex;gap:5px;margin:9px 0 2px;align-items:center}
.pstep{flex:1;height:5px;border-radius:3px;background:var(--panel3);position:relative;overflow:visible}
.pstep.done{background:var(--green)}
.pstep.cur{background:var(--blue)}
.plbl{display:flex;justify-content:space-between;font-size:10.5px;color:var(--weak);margin-bottom:8px}
.plog{background:#060B14;border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:12px;font-family:var(--mono);color:#9FC3F2;white-space:pre-wrap;max-height:240px;overflow:auto;line-height:1.55;word-break:break-all}
.pill{font-size:11.5px;border-radius:999px;padding:3px 11px;background:var(--panel3);color:var(--sub);display:inline-flex;align-items:center;gap:6px}
.pill .dp{width:7px;height:7px;border-radius:50%;background:var(--weak)}
.pill.on{background:var(--green-bg);color:#7FE0AE}.pill.on .dp{background:var(--green)}
.pill.off{background:var(--red-bg);color:#FFB3AE}.pill.off .dp{background:var(--red)}
.pipe-hint{background:var(--amber-bg);border:1px solid rgba(245,181,68,.3);color:#FFE2A6;border-radius:11px;padding:10px 14px;margin-bottom:12px;font-size:13px}
.pipe-hint code{background:rgba(245,181,68,.14);border-radius:5px;padding:1px 6px}
.scanrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px dashed var(--line2);border-radius:11px;padding:11px 13px;margin-bottom:12px}
.scanrow .srow{display:flex;gap:8px;flex:1 1 100%;align-items:center;flex-wrap:wrap}
.scanrow input{flex:1 1 300px;min-width:200px;font-size:14px}
.scanrow .tip{font-size:11.5px;color:var(--weak);flex:1 1 100%}
.scan-dirs{display:flex;gap:6px;flex-wrap:wrap;flex:1 1 100%;margin-top:2px}
.scan-chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel3);border:1px solid var(--line);color:var(--sub);border-radius:999px;padding:3px 10px;font-size:11.5px;max-width:100%}
.scan-chip .p{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:300px}
.scan-chip .x{cursor:pointer;color:var(--weak);padding:0 2px;font-size:13px;line-height:1}
.scan-chip .x:hover{color:var(--red)}
.scan-chip.base{background:transparent;color:var(--weak);border-style:dashed}
.sec-h{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:8px;margin:16px 0 9px;font-weight:600;letter-spacing:.2px}
.sec-h::before{content:"";width:3px;height:13px;border-radius:2px;background:var(--blue)}
.emptyline{border:1.5px dashed var(--line);border-radius:12px;padding:26px;text-align:center;color:var(--weak);font-size:13px;background:transparent}

/* ===== 快速捕获浮层 ===== */
.mask{position:fixed;inset:0;background:rgba(3,7,15,.6);backdrop-filter:blur(3px);z-index:80;display:none;align-items:center;justify-content:center;padding:20px}
.mask.show{display:flex}
.sheet{background:var(--panel2);border:1px solid var(--line2);border-radius:16px;max-width:540px;width:100%;padding:20px;box-shadow:0 24px 70px rgba(0,0,0,.5);animation:pop .16s ease}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
.sheet h3{font-size:15px;margin-bottom:13px;display:flex;align-items:center;gap:8px}
.sheet textarea{resize:vertical;min-height:90px}
.sheet .sr{display:flex;gap:8px;margin-top:12px;justify-content:flex-end}
.sheet .sr button{min-height:40px;padding:0 16px;border-radius:9px;font-size:13.5px}

/* toast */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#1B2B47;color:#fff;border:1px solid var(--line2);padding:9px 18px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.bottomnav{display:none}
@media(max-width:1100px){.app{grid-template-columns:1fr}.side{display:none}.top{position:sticky;top:0;z-index:40}.todaybar{padding-top:4px}.content{padding-bottom:96px}.bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:70;background:rgba(11,18,32,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:3px}.bn-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--sub);padding:6px 0 4px;border-radius:9px;min-height:50px}.bn-btn .icon{width:19px;height:19px}.bn-btn.on{color:var(--blue);background:var(--blue-bg)}}
@media(max-width:980px){.split{grid-template-columns:1fr}.right-col{position:static;max-height:none}.dp-src{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1101px){.todaybar{padding-left:18px;padding-right:18px}}
</style>
</head>
<body>
<div class="app">

  <!-- 左导航 -->
  <aside class="side">
    <div class="brand"><div class="logo"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5c-1.6-1.5-3.8-2.2-6.5-2.2v14.5c2.7 0 4.9.7 6.5 2.2 1.6-1.5 3.8-2.2 6.5-2.2V2.8c-2.7 0-4.9.7-6.5 2.2z"/><path d="M12 5v14.5"/></svg></span></div>
      <div><div class="t1">数据工作台</div><div class="t2">Embodied Data Desk</div></div>
    </div>
    <nav class="nav" id="sideNav">

<script>
"use strict";
/* DOM id 全集（自检锚点）
sideNav  todayBar  kCats kList kDetail  pViewSeg pCats pLangs pState pList pDetail
nCats nForm nTitle nContent nTags nDoneSeed nAdd nAdd2 nList
pdpStatus pipeRefresh pipeHint dpSrc pipeList pipeLog
topTtl topCnt topSearch btnQuick btnExport btnImport btnClear btnClear2 fileIn
qcMask qcTitle qcContent qcTags qcClose qcSave toast backBanner bdgK bdgP bdgN */
var K = (window.WB_K || []).slice();
var P = (window.WB_P || []).slice();
var LS_STATE="wb_ew_state", LS_NOTES="wb_ew_notes", LS_SEEDDONE="wb_ew_seed_v1";
var Store={state:{},notes:[]};
var CATNAME={collection:"数据采集",processing:"数据处理",format:"格式标准",tools:"工具链",model:"模型训练"};
var CATCOLOR={collection:"var(--blue)",processing:"var(--green)",format:"var(--amber)",tools:"var(--violet)",model:"var(--pink)"};

function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function pad(n){return n<10?"0"+n:""+n;}
function toISO(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function nowISO(){return toISO(new Date());}
function dayDiff(iso){var t=new Date(iso+"T00:00:00");var n=new Date();n.setHours(0,0,0,0);return Math.round((n-t)/86400000);}
function fmtDate(iso){var d=new Date(iso+"T00:00:00");var s=(d.getMonth()+1)+"月"+d.getDate()+"日";if(d.getFullYear()!==new Date().getFullYear())s=d.getFullYear()+" "+s;return s;}
function catName(c){return CATNAME[c]||c||"其他";}
function $id(x){return document.getElementById(x);}

function loadStore(){try{Store.state=JSON.parse(localStorage.getItem(LS_STATE))||{};}catch(e){Store.state={};}
  try{Store.notes=JSON.parse(localStorage.getItem(LS_NOTES))||[];}catch(e){Store.notes=[];}
  if(!localStorage.getItem(LS_SEEDDONE))seedNotes();}
function saveStore(){try{localStorage.setItem(LS_STATE,JSON.stringify(Store.state));localStorage.setItem(LS_NOTES,JSON.stringify(Store.notes));localStorage.setItem(LS_SEEDDONE,"1");}catch(e){toast("本地存储失败：请先导出备份再清空本地数据");}}
function pState(id){var s=Store.state[id];return{read:!!(s&&s.read),starred:!!(s&&s.starred)};}
function setPState(id,p){var s=Store.state[id]||{};for(var k in p)s[k]=p[k];Store.state[id]=s;saveStore();}
function seedNotes(){var t=nowISO();Store.notes=[
  {id:"n-seed-1",title:"采集字段命名已与算法对齐",content:"meta 统一用 operator / device_config / language_instruction / success_flag，snake_case，YAML 输出。collector 的 start/end 已带校验。\n以后新增字段先记到这里，再决定是否改 schema。",tags:["meta","采集","collector"],pinned:true,done:false,created:t,updated:t},
  {id:"n-seed-2",title:"想法：失败片段单独建库",content:"采集自动化里让机器人自己乱抓→自动重试，把 failure-recovery 片段单独标签归档，训练时按比例混入。参考 DROID 用成功率预测器清洗数据的思路。",tags:["数据飞轮","D405"],pinned:false,done:false,created:t,updated:t},
  {id:"n-seed-3",title:"家里机验证：LeRobot + ACT 可跑",content:"conda lerobot 环境，ACT 训练 CPU 模式 step3000：loss 3.1 → 0.97，数据链路有效。公司 3090 上可全速训练。",tags:["LeRobot","ACT"],pinned:false,done:true,created:t,updated:t}];}

/* ===== 状态 ===== */
var UI={tab:"knowledge",kCat:"all",pCat:"all",pLang:"all",pState:"unread",pView:"list",nFilter:"open",
  selK:null,selP:null,q:"",qcFrom:"",editNoteId:null,shownSum:{}};
var Pipeline={items:[],loaded:false,busy:false,lastLog:""};

function P_LIST(){return P.slice().sort(function(a,b){return(b.added_at||"").localeCompare(a.added_at||"");});}
function N_LIST(){var a=Store.notes.slice().sort(function(a,b){if(!!a.pinned!==!!b.pinned)return a.pinned?-1:1;return(b.updated||"").localeCompare(a.updated||"");});
  if(UI.nFilter==="open")a=a.filter(function(n){return !n.done;});if(UI.nFilter==="done")a=a.filter(function(n){return n.done;});return a;}

/* ===== 顶部 ===== */
var TTL={knowledge:["数据知识库","采集 · 处理 · 格式 · 工具链"],papers:["论文自动流","每日自动收录 · 去重 · 状态管理"],notes:["我的积累","数据工程师日志"],pipeline:["数据处理中心","任一采集源 → 标准数据集 → 训练"]};
function renderTop(){var t=TTL[UI.tab];var _s=function(id,v){var e=$id(id);if(e)e.textContent=v;};
  _s("topTtl",t[0]);_s("topCnt",t[1]);_s("bdgK",K.length);_s("bdgP",unreadCount());_s("bdgN",openNotes());
  var sb="";if(unreadCount()>0)sb+='<div class="tchip ov"><span class="n">'+ovd()+'</span>逾期未读</div>';sb+='<div class="tchip new"><span class="n">'+newN()+'</span>今/昨新到</div>';if(starN()>0)sb+='<div class="tchip star"><span class="n">'+starN()+'</span>待精读</div>';
  var tb=$id("todayBar");if(tb)tb.innerHTML=sb;}
function unreadCount(){var c=0;P.forEach(function(p){if(!pState(p.id).read)c++;});return c;}
function ovd(){var c=0;P.forEach(function(p){var s=pState(p.id);if(!s.read&&dayDiff(p.added_at)>3)c++;});return c;}
function newN(){var c=0;P.forEach(function(p){var s=pState(p.id);if(!s.read&&dayDiff(p.added_at)<=1)c++;});return c;}
function starN(){var c=0;P.forEach(function(p){var s=pState(p.id);if(s.starred&&!s.read)c++;});return c;}
function openNotes(){return Store.notes.filter(function(n){return !n.done;}).length;}

/* ===== 知识库 ===== */
function kList(){var order=["all","collection","processing","format","tools"];
  return order.map(function(c){var n=c==="all"?K.length:K.filter(function(k){return k.cat===c;}).length;var lb=c==="all"?"全部":catName(c);
    return'<button class="chip'+(UI.kCat===c?" on":"")+'" data-kcat="'+c+'">'+lb+'<span class="n">'+n+"</span></button>";}).join("");}
function kFiltered(){var q=UI.q.trim().toLowerCase();return K.filter(function(k){
  if(UI.kCat!=="all"&&k.cat!==UI.kCat)return false;if(!q)return true;
  var hay=(k.title+" "+k.summary+" "+(k.tags||[]).join(" ")+" "+k.detail).toLowerCase();return hay.indexOf(q)>=0;});}
function relPapers(k){
  var tags=(k.tags||[]).map(function(t){return t.toLowerCase();});
  var words=(k.title||"").toLowerCase().split(/[\s:：·,，]/).filter(function(w){return w.length>2;});
  var hit=P.filter(function(p){var pt=(p.tags||[]).map(function(t){return t.toLowerCase();});
    var h=(p.title||"").toLowerCase()+" "+(p.summary||"").toLowerCase();
    return pt.some(function(t){return tags.indexOf(t)>=0;})||words.some(function(w){return h.indexOf(w)>=0;});
  }).slice(0,5);
  var star=(pState)&&hit.filter(function(p){return pState(p.id).starred;});
  return hit;
}
function renderKnowledge(){var hasQuery=UI.q.trim();if(hasQuery&&UI.kCat!=="all"&&!K.filter(function(k){return k.cat===UI.kCat;}).length){/* keep */}
  $id("kCats").innerHTML=kList();var list=kFiltered();var el=$id("kList");
  if(!list.length){el.innerHTML='<div class="emptyline">没有匹配的知识卡片，换个关键词或分类试试</div>';renderKDetail(null);return;}
  el.innerHTML=list.map(function(k){
    var col=CATCOLOR[k.cat]||"var(--weak)";
    return'<button class="krow'+(UI.selK===k.id?" sel":"")+'" data-kid="'+k.id+'">'+
      '<span class="kdot" style="background:'+col+'"></span>'+
      '<span style="flex:1;min-width:0"><span class="kt">'+esc(k.title)+"</span><div class=\"ks\">"+esc(k.summary)+"</div></span>"+
      '<span class="kr"><span class="cat '+k.cat+'">'+catName(k.cat)+"</span></span></button>";}).join("");
  if(UI.selK&&!kFiltered().some(function(k){return k.id===UI.selK;}))UI.selK=null;
  renderKDetail(UI.selK?K.find(function(x){return x.id===UI.selK;}):kFiltered()[0]||null);}
function renderKDetail(k){var el=$id("kDetail");
  if(!k){el.innerHTML='<div class="placeholder">点选左侧知识卡片，就地查看要点、标签与关联论文</div>';return;}
  var rel=relPapers(k);
  var relHtml=rel.length?rel.map(function(p){
    return'<div class="rl" data-relpid="'+p.id+'"><span class="star-mark">'+(pState(p.id).starred?"★":"")+'</span><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(p.title)+'</span><span class="ar">查看 →</span></div>';}).join(""):
    '<div style="font-size:12px;color:var(--weak);padding:4px 2px">暂无自动关联论文（按标签/关键词匹配），可后续人工标注关联</div>';
  el.innerHTML='<div class="dph"><span class="cat '+k.cat+'">'+catName(k.cat)+'</span><span class="tags">'+k.tags.map(function(t){return'<span class="tag">'+esc(t)+"</span>";}).join("")+"</span></div>"+
    "<h3>"+esc(k.title)+"</h3>"+
    '<div class="dmeta"><span>收录于知识库 · 人工维护</span></div>'+
    '<div class="dsum">'+esc(k.summary)+"</div>"+
    '<ul class="dlist">'+k.detail.split("\n").map(function(l){return"<li>"+esc(l)+"</li>";}).join("")+"</ul>"+
    '<div class="related"><div class="sec-h" style="margin-top:0">关联论文（'+rel.length+"）</div>"+relHtml+"</div>";}

/* ===== 论文 ===== */
function pCatsHtml(){var order=["all","collection","processing","format","model"];var set={};P.forEach(function(p){set[p.category]=1;});
  order=order.concat(Object.keys(set).filter(function(c){return order.indexOf(c)<0;}));
  return order.map(function(c){var n=c==="all"?P.length:P.filter(function(p){return(p.category||"")===c;}).length;
    if(c!=="all"&&!n)return"";return'<button class="chip'+(UI.pCat===c?" on":"")+'" data-pcat="'+c+'">'+(c==="all"?"全部":catName(c))+'<span class="n">'+n+"</span></button>";}).join("");}
function pLangsHtml(){var e=0,c=0;P.forEach(function(p){if(p.lang==="cn")c++;else e++;});

  if(target==="notes"&&!hn)target="knowledge";
  setTab(target);
  if(target==="knowledge"&&!kFiltered().length){UI.kCat="all";renderKnowledge();if(!kFiltered().length)toast('知识库无匹配：'+q);else toast('已按关键词过滤：'+q);}
  if(target==="papers"&&!pFiltered().length){UI.pState="all";UI.pView="list";renderPapers();}
  toast((hitK?"知识 ":"")+(hitP?"论文 ":"")+(hn?"笔记":"")+"命中 → 已跳转"+TTL[target][0]);});
document.getElementById("btnQuick").addEventListener("click",openQuick);

document.getElementById("btnExport").addEventListener("click",exportJSON);
document.getElementById("btnImport").addEventListener("click",function(){$id("fileIn").click();});
document.getElementById("fileIn").addEventListener("change",function(){if(this.files&&this.files[0])importJSON(this.files[0]);this.value="";});
function doClear(){clearLocal();}
document.getElementById("btnClear").addEventListener("click",doClear);
document.getElementById("btnClear2").addEventListener("click",doClear);
document.getElementById("qcClose").addEventListener("click",closeQuick);
document.getElementById("qcSave").addEventListener("click",saveQuick);
document.getElementById("qcMask").addEventListener("click",function(e){if(e.target.id==="qcMask")closeQuick();});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeQuick();});
document.getElementById("nAdd").addEventListener("click",addNoteInline);
document.getElementById("nTitle").addEventListener("keydown",function(e){if(e.key==="Enter")addNoteInline();});
function addNoteInline(){var t=$id("nTitle").value.trim(),c=$id("nContent").value.trim();if(!t&&!c){toast("写点内容再记");return;}
  var tags=$id("nTags").value.split(/[,，]/).map(function(s){return s.trim();}).filter(Boolean);
  var nw=nowISO();Store.notes.push({id:uid(),title:t||"(无标题)",content:c,tags:tags,pinned:false,done:$id("nDoneSeed").value==="1",created:nw,updated:nw});
  saveStore();$id("nTitle").value="";$id("nContent").value="";$id("nTags").value="";renderNotes();renderTop();toast("已记录");}
document.getElementById("nCats").addEventListener("click",function(e){var b=e.target.closest("[data-nfilter]");if(!b)return;UI.nFilter=b.dataset.nfilter;renderNotes();});
document.getElementById("nList").addEventListener("click",function(e){
  var card=e.target.closest("[data-nid]");if(!card)return;var nid=card.dataset.nid;
  var sb=e.target.closest("[data-nsave]");
  if(sb){var v1=$id("enT").value.trim(),v2=$id("enC").value.trim(),v3=$id("enTag").value;
    var ix=Store.notes.findIndex(function(n){return n.id===nid;});if(ix>=0){Store.notes[ix].title=v1||"(无标题)";Store.notes[ix].content=v2;
      Store.notes[ix].tags=v3.split(/[,，]/).map(function(s){return s.trim();}).filter(Boolean);Store.notes[ix].updated=nowISO();}
    UI.editNoteId=null;saveStore();renderNotes();return;}
  if(e.target.closest("[data-ncancel]")){UI.editNoteId=null;renderNotes();return;}
  var ab=e.target.closest("[data-act]");if(ab){var i2=Store.notes.findIndex(function(n){return n.id===nid;});if(i2<0)return;var act=ab.dataset.act;
    if(act==="done")Store.notes[i2].done=!Store.notes[i2].done;
    else if(act==="pin")Store.notes[i2].pinned=!Store.notes[i2].pinned;
    else if(act==="edit"){UI.editNoteId=nid;renderNotes();return;}
    else if(act==="del"){if(!confirm("删除这条笔记？\n"+Store.notes[i2].title))return;Store.notes.splice(i2,1);}
    Store.notes[i2].updated=nowISO();saveStore();renderNotes();renderTop();return;}
  if(e.target.closest(".nt,.nd,.nm")){UI.editNoteId=nid;renderNotes();}});
document.getElementById("pipeRefresh").addEventListener("click",refreshPipeline);
document.getElementById("pipeList").addEventListener("click",function(e){var b=e.target.closest("[data-pipe-run]");if(!b)return;pipeRun(b.dataset.pipeRun,b.dataset.pipeTarget);});
document.getElementById("scanAdd").addEventListener("click",addScanDir);
document.getElementById("scanInput").addEventListener("keydown",function(e){if(e.key==="Enter")addScanDir();});
document.getElementById("scanDirs").addEventListener("click",function(e){var x=e.target.closest("[data-scan-remove]");if(!x)return;delScanDir(x.dataset.scanRemove);});

/* ===== 启动 ===== */
function boot(){loadStore();refreshAll();if(engineLive())refreshPipeline();
  var h0=(location.hash||"").replace("#","");if(["papers","notes","pipeline"].indexOf(h0)>=0)setTab(h0);}
try{boot();window.addEventListener("error",function(e){var el=document.getElementById("jsErr");if(el){el.style.display="block";el.textContent="JS 错误："+(e.message||e.error||e);}});}catch(e){var d=document.createElement("div");d.id="jsErr";d.style.cssText="position:fixed;left:12px;right:12px;bottom:12px;background:#3a0a0a;color:#ff9b9b;border:1px solid #ff6161;padding:10px 14px;border-radius:10px;font-size:12px;font-family:Consolas,monospace;z-index:200;white-space:pre-wrap";d.textContent="JS 启动错误："+(e&&e.message?e.message:e)+"\n"+(e&&e.stack?e.stack:"");document.body.appendChild(d);}
</script>
